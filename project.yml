name: deleks
options:
  bundleIdPrefix: com.origamisoftware
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: NJ55UC9QDK
packages:
  deleksCore:
    path: deleksCore
targets:
  deleks:
    type: application
    platform: iOS
    sources:
      - deleks
      - Shared
      # The About box shows the license from the repository's own file.
      - path: LICENSE
        buildPhase: resources
    dependencies:
      - package: deleksCore
    info:
      path: deleks/Info.plist
      properties:
        CFBundleDisplayName: deleks
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.origamisoftware.deleks
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  deleksTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - deleksTests
    dependencies:
      - target: deleks
      - package: deleksCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.origamisoftware.deleks.tests
  deleksUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - deleksUITests
      - Shared
      # So the tests compare the About box with the same license the app bundles.
      - path: LICENSE
        buildPhase: resources
    dependencies:
      - target: deleks
      # Shared/Keypad.swift names deleksCore's directions.
      - package: deleksCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.origamisoftware.deleks.uitests
  deleksStoreScreenshots:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - deleksStoreScreenshots
      - Shared
    dependencies:
      - target: deleks
      # Plays the shots with the engine's own rules.
      - package: deleksCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.origamisoftware.deleks.storescreenshots
schemes:
  deleks:
    build:
      targets:
        deleks: all
        deleksTests: [test]
        deleksUITests: [test]
    test:
      targets:
        - deleksTests
        - deleksUITests
        - package: deleksCore/deleksCoreTests
  # Takes the App Store screenshots; not part of the test suite. See docs/app-store/listing.md.
  deleksStoreScreenshots:
    build:
      targets:
        deleks: all
        deleksStoreScreenshots: [test]
    test:
      targets:
        - deleksStoreScreenshots
